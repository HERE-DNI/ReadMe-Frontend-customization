<!--
  HERE Global Landing Page — ReadMe Shell
  ────────────────────────────────────────
  Purpose: replace the large landing-page markup with a thin shell that
  fetches the real content from GitHub Pages at runtime. Enables a
  "staging" preview via ?stagingGLP=true without impacting normal
  visitors.

  Pattern based on the Miro developer portal example provided by ReadMe
  support:
    - Live: https://developers.miro.com/
    - Content: https://miroapp.github.io/developer-homepage/

  Files this shell selects between:
    - Production:  index.html          (what visitors normally see)
    - Staging:     index-staging.html  (work-in-progress preview)

  Both are served from the same GitHub Pages repo:
    https://here-dni.github.io/ReadMe-Frontend-customization/

  Trigger the staging version by adding ?stagingGLP=true to any URL:
    https://docs.here.com/?stagingGLP=true

  IMPORTANT: paste this entire block into ReadMe's Custom Page editor
  (replacing the current large index.html contents). Once installed you
  will rarely need to touch it again — all real changes happen in the
  external index.html / index-staging.html files.
-->

<section id="here-glp-mount"
         class="here-glp-shell"
         aria-live="polite"
         aria-busy="true"
         data-here-glp-shell>
  <div class="here-glp-shell__loading" role="status">Loading landing page…</div>
</section>

<style>
  /* Minimal shell styling. Kept scoped so it doesn't leak. Real page
     styles live in the fetched HTML. */
  .here-glp-shell { min-height: 60vh; }
  .here-glp-shell__loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50vh;
    color: #6b8a99;
    font-family: "Fira GO", "Fira Sans", system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: -0.2px;
  }
  .here-glp-shell__error {
    max-width: 640px;
    margin: 48px auto;
    padding: 20px 24px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    color: #991b1b;
    font-family: "Fira GO", "Fira Sans", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .here-glp-shell__error strong { display: block; margin-bottom: 6px; }
  .here-glp-shell__error code {
    background: rgba(153, 27, 27, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
  }
  [data-color-mode="dark"] .here-glp-shell__loading { color: rgba(232, 237, 240, 0.55); }
  [data-color-mode="dark"] .here-glp-shell__error {
    background: rgba(153, 27, 27, 0.15);
    border-color: rgba(254, 202, 202, 0.25);
    color: #fecaca;
  }
</style>

<script>
(function () {
  "use strict";

  // Idempotency guard — ReadMe SPA can execute this snippet more than
  // once on client-side route changes. Bail if we've already mounted.
  var TAG = "__here_glp_shell_v1";
  if (window[TAG]) return;
  window[TAG] = true;

  var BASE = "https://here-dni.github.io/ReadMe-Frontend-customization/";
  var PROD_URL = BASE + "index.html";
  var STAGING_URL = BASE + "index-staging.html";
  var PARAM = "stagingGLP";

  function isStaging() {
    // Look for stagingGLP=true across the URL search + hash so a bookmark
    // like docs.here.com/#stagingGLP=true also works.
    var raw = (window.location.search || "") + "&" + (window.location.hash || "").replace(/^#/, "");
    return new RegExp("(?:^|[?&#])" + PARAM + "=true(?:&|$)").test(raw);
  }

  function bust(u) {
    // Skip cache on staging so previews are always fresh. Production is
    // fine to cache — GitHub Pages sets short TTLs already.
    return isStaging() ? u + (u.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now() : u;
  }

  function showError(mount, message, err) {
    mount.setAttribute("aria-busy", "false");
    mount.innerHTML =
      '<div class="here-glp-shell__error">' +
      "<strong>Landing page failed to load</strong>" +
      message +
      (err ? "<br /><br />Error: <code>" + String(err.message || err) + "</code>" : "") +
      "</div>";
  }

  function reExecuteScripts(root) {
    // innerHTML injection does not execute inline <script> tags by spec.
    // Clone each into a fresh element so the browser evaluates it.
    root.querySelectorAll("script").forEach(function (oldEl) {
      var s = document.createElement("script");
      Array.prototype.slice.call(oldEl.attributes).forEach(function (a) {
        s.setAttribute(a.name, a.value);
      });
      s.text = oldEl.textContent;
      oldEl.replaceWith(s);
    });
  }

  function mount() {
    var target = document.getElementById("here-glp-mount");
    if (!target) return;

    var url = isStaging() ? STAGING_URL : PROD_URL;

    fetch(bust(url), { cache: isStaging() ? "no-store" : "default" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
        return r.text();
      })
      .then(function (html) {
        // Strip anything that would break re-injection into this document:
        //   - <!DOCTYPE>, <html>, <head>, <body> if present
        html = html
          .replace(/<!DOCTYPE[^>]*>/gi, "")
          .replace(/<\/?html[^>]*>/gi, "")
          .replace(/<head[\s\S]*?<\/head>/gi, "")
          .replace(/<\/?body[^>]*>/gi, "");

        target.innerHTML = html;
        target.setAttribute("aria-busy", "false");

        // If staging, add a small badge so previewers know the page is
        // NOT what other visitors see.
        if (isStaging() && !document.getElementById("here-glp-stagingbadge")) {
          var b = document.createElement("div");
          b.id = "here-glp-stagingbadge";
          b.textContent = "STAGING PREVIEW";
          b.style.cssText =
            "position:fixed;right:16px;bottom:16px;z-index:999999;" +
            "padding:8px 12px;border-radius:999px;" +
            "background:#dc2626;color:#fff;" +
            "font:700 12px/1 system-ui,sans-serif;" +
            "box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;";
          document.body.appendChild(b);
        }

        reExecuteScripts(target);
      })
      .catch(function (err) {
        console.error("[here-glp-shell] fetch failed:", err);
        showError(
          target,
          "Refresh the page. If the problem persists, contact the docs team.",
          err
        );
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
