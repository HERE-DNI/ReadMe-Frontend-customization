<!--
  HERE Global Landing Page — TEST-ONLY Custom Page shell
  ────────────────────────────────────────────────────────
  Scope: this file is scoped to THIS custom page only. Nothing here
  should be copied into global Body/Footer Custom Code — that runs on
  every route and would affect all pages.

  Why not just paste a <script> like before: ReadMe Custom Pages inject
  their HTML body through React (dangerouslySetInnerHTML-equivalent),
  and per HTML spec, browsers do NOT execute inline <script> tags that
  arrive via innerHTML. That's why the old shell never fired the fetch.

  Fix used here (still page-scoped, no global changes):
    1. Loader logic is defined as an external .js file
       (index-glp-loader.js) hosted on the same GitHub Pages repo, and
       referenced via <script src="...">. External script tags DO get
       fetched + executed even when injected via innerHTML, because the
       browser treats src-based scripts differently from inline ones.
    2. As a belt-and-suspenders fallback (in case this ReadMe project's
       sanitizer strips ALL <script> tags including src-based ones), an
       inline DOM event handler attribute (onerror on a 1x1 tracking
       pixel) also triggers the mount. Inline event handler attributes
       are NOT <script> tags, so they are not subject to the same
       injection restriction and do execute.

  Trigger the staging version by adding ?stagingGLP=true to any URL:
    https://docs.here.com/test-doptools/page/test-glp?stagingGLP=true

  Files this shell selects between (served from GitHub Pages):
    - Production:  index.html
    - Staging:     index-staging.html
  Base URL:
    https://here-dni.github.io/ReadMe-Frontend-customization/
-->

<section id="here-glp-mount"
         class="here-glp-shell"
         aria-live="polite"
         aria-busy="true"
         data-here-glp-shell>
  <div class="here-glp-shell__loading" role="status">Loading landing page…</div>
</section>

<style>
  /* Minimal shell styling, kept scoped so it doesn't leak. Real page
     styles live in the fetched HTML. */
  .here-glp-shell { min-height: 60vh; }
  .here-glp-shell__loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50vh;
    color: #6b8a99;
    font-family: "Fira GO", "Fira Sans", system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: -0.2px;
  }
  .here-glp-shell__error {
    max-width: 640px;
    margin: 48px auto;
    padding: 20px 24px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    color: #991b1b;
    font-family: "Fira GO", "Fira Sans", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .here-glp-shell__error strong { display: block; margin-bottom: 6px; }
  .here-glp-shell__error code {
    background: rgba(153, 27, 27, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
  }
  [data-color-mode="dark"] .here-glp-shell__loading { color: rgba(232, 237, 240, 0.55); }
  [data-color-mode="dark"] .here-glp-shell__error {
    background: rgba(153, 27, 27, 0.15);
    border-color: rgba(254, 202, 202, 0.25);
    color: #fecaca;
  }

  /* Hide the ReadMe Custom Page title/header chrome on THIS test page
     only. This CSS lives inside the Custom Page body, so it is scoped
     to this page's rendered DOM and does not touch global styles. */
  [class^="SuperHubCustomPage-content-header"] {
    display: none;
  }
  [class^="SuperHubCustomPage-content"] {
    padding: 0;
  }
</style>

<!-- Primary: external script — executes even when injected via innerHTML. -->
<script src="https://here-dni.github.io/ReadMe-Frontend-customization/index-glp-loader.js" defer></script>

<!--
  Fallback: only fires if the <script src> above got stripped by a
  sanitizer. Harmless no-op if the loader already ran (guarded by
  data-here-glp-mounted on the mount node). The 1x1 pixel's onerror
  fires immediately since "x" is not a real image URL.
-->
<img src="x" alt="" width="1" height="1" style="position:absolute;width:1px;height:1px;opacity:0;"
     onerror="(function(el){
       var s=document.createElement('script');
       s.src='https://here-dni.github.io/ReadMe-Frontend-customization/index-glp-loader.js';
       document.body.appendChild(s);
       el.remove();
     })(this)" />
